# Opcional: a interface (python -m espumas web) cria e atualiza o config.yaml sozinha.
# Copie para config.yaml se preferir editar à mão. Tudo aqui é opcional.

# Usuário do Discord -> apelido no relatório e conta no Valorant.
jogadores:
  ronaldo.vels:
    apelido: Ronaldo
    riot: Ronaldovels#BR1
  # amigo: Kaio            # forma curta: só o apelido

# Dados da partida (HenrikDev API, não oficial). Chave grátis no Discord deles.
riot:
  api_key: ""
  riot_id: ""              # Nome#TAG de quem busca as partidas
  regiao: br
  plataforma: pc

sinc:
  palavra: espumas         # falada na call no momento combinado
  round: 1                 # momento combinado: barreira caindo no round 1
  fase: round              # "round" (relógio do round) ou "buy" (relógio da compra)
  restantes_s: 100         # relógio mostrando 1:40 = barreira caindo
  janela_inicio_s: 900     # sem horário: só vale a palavra nos primeiros 15 min
  janela_relogio_s: 240    # com horário: só ±4 min de onde o round 1 deveria estar
  buy_fase_s: 30
  ajuste_max_s: 20         # ajuste fino pelas mortes, no máximo ±20 s

transcricao:
  modelo: large-v3-turbo   # ou large-v3 (um pouco mais preciso, mais lento)
  idioma: pt
  dispositivo: cuda        # cpu se não tiver GPU
  compute_type: float16    # int8_float16 usa menos VRAM
  beam_size: 5

# Palavras que o Whisper deve conhecer (apelidos do time, callouts próprios).
vocabulario:
  - Espumas

# Correções forçadas depois da transcrição (sem diferenciar maiúsculas).
correcoes: {}
  # "ronaldin": "Ronaldo"

metricas:
  juntar_gap_s: 0.6              # pausa que separa duas falas do mesmo jogador
  min_sobreposicao_s: 0.3        # sobreposição menor que isso é ignorada
  backchannel_max_palavras: 2    # "boa", "uhum", "ok" não contam como interrupção
  backchannel_max_s: 0.8
  callout_longo_s: 6.0
  callout_longo_palavras: 18
  janela_ordens_s: 3.0
